# Mirror GNU's release tree, ftp.gnu.org/gnu, into a Cloudflare R2 bucket twice a day, from
# a list diff: a secondary's listing against the state the last run left in the bucket. The
# toolbox, which starts a run, contains it in an image, resolves its secrets, renders and
# checks it, and reports it, and the rsync engine, which moves the bytes, draws the
# directory pages, reads them back and orders the pipeline, are katoptra/lib's, included
# below at v2 and flattened into this file. What is here is the mirror's identity and
# nothing else. R2 is reached through the AWS CLI, configured by the three AWS_* variables
# op.env resolves from 1Password, which cross into the image by name.
version: '3'

vars:
  SOURCE: rsync://mirror.csclub.uwaterloo.ca/gnu/   # a secondary, as GNU asks; about 2 h behind ftp.gnu.org
  HOST: gnu.katoptra.org                           # a fork changes this line and the address in PAGE_FOOT
  BUCKET: gnu                                      # bucket name; objects sit at its root under GNU's own paths
  CEILING_GB: 350                                  # refuse to run past this many decimal GB upstream; 274 GB in September 2026
  LIST_FLOOR: 40000                                # a listing under this many lines is a truncated one; the tree is ~43,850 files
  INDEX: '{{.HOST}}.directory.index.html'          # the page drawn in every directory; no upstream path can carry the name
  # The line every directory page closes on. GNU's mirror guidelines allow short,
  # explanatory text and no link but a bug-reporting one: an address that takes mail.
  PAGE_FOOT: 'A mirror of https://ftp.gnu.org/gnu/, updated twice a day. Sizes in bytes, times as upstream lists them. Report a problem to <a href="mailto:gnu@katoptra.org">gnu@katoptra.org</a>.'
  CANARY: aspell/dict/0index.html                  # 8 plain http:// links, which the zone's HTML rewriters would alter
  FRESH_KEY: mirror-updated-timestamp.txt          # ftp.gnu.org's clock, Unix time; a day old fails the run

includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
    flatten: true
    vars:
      NAME: gnu
      DESC: a twice-daily mirror of ftp.gnu.org/gnu, from {{.SOURCE}}, at https://{{.HOST}}/
  rsync:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/engines/rsync.yml
    flatten: true
